<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 375" width="300" height="375">
  <defs>
    <linearGradient id="bgGrad-sp-vercel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040e24"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#01030a"/>
    </linearGradient>
    <linearGradient id="borderGrad-sp-vercel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(0, 210, 255, 0.75)"/>
      <stop offset="50%" stop-color="rgba(37, 99, 235, 0.35)"/>
      <stop offset="100%" stop-color="rgba(0, 210, 255, 0.65)"/>
    </linearGradient>
    <radialGradient id="coreGlow-sp-vercel" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="rgba(0, 210, 255, 0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Card Background with High-Tech Border -->
  <rect width="300" height="375" rx="4" fill="url(#bgGrad-sp-vercel)"/>
  <rect width="300" height="375" rx="4" fill="url(#coreGlow-sp-vercel)"/>
  <rect x="1.5" y="1.5" width="297" height="372" rx="3" fill="none" stroke="url(#borderGrad-sp-vercel)" stroke-width="1.5"/>

  <!-- Subtle Cyber Grid -->
  <g stroke="rgba(0, 210, 255, 0.08)" stroke-width="1">
    <line x1="20" y1="0" x2="20" y2="375"/>
    <line x1="280" y1="0" x2="280" y2="375"/>
    <line x1="0" y1="260" x2="300" y2="260"/>
  </g>

  <!-- Corner Reticle Accents -->
  <path d="M 10 24 L 10 10 L 24 10" fill="none" stroke="#00D2FF" stroke-width="2"/>
  <path d="M 290 24 L 290 10 L 276 10" fill="none" stroke="#00D2FF" stroke-width="2"/>
  <path d="M 10 351 L 10 365 L 24 365" fill="none" stroke="#00D2FF" stroke-width="2"/>
  <path d="M 290 351 L 290 365 L 276 365" fill="none" stroke="#00D2FF" stroke-width="2"/>

  <!-- Tier Badge -->
  <rect x="25" y="32" width="250" height="22" rx="11" fill="rgba(0, 210, 255, 0.12)" stroke="rgba(0, 210, 255, 0.45)" stroke-width="1"/>
  <text x="150" y="47" fill="#00D2FF" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1.5" text-anchor="middle">CLOUD DEPLOYMENT PARTNER</text>

  <!-- Central Emblem -->
  
            <g transform="translate(150, 150) scale(1.5)">
                <polygon points="0,-30 28,22 -28,22" fill="#FFFFFF"/>
            </g>
        

  <!-- Brand Name & Description -->
  <text x="150" y="295" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="800" letter-spacing="1" text-anchor="middle">Vercel</text>
  <text x="150" y="322" fill="rgba(255, 255, 255, 0.65)" font-family="system-ui, sans-serif" font-size="11" font-weight="400" text-anchor="middle">Deploy Web Innovations at the Edge</text>

  <!-- Verification Chip -->
  <circle cx="150" cy="346" r="3" fill="#00D2FF"/>
</svg>